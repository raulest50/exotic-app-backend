
spring:
  application:
    name: exotic-app

  config:
    additional-location: classpath:application-secrets.properties
    import:
      - optional:file:./.local/agent-assistant.properties
      - classpath:module-timeouts.yml

  datasource:
    #url: jdbc:mysql://mysql-container:3306/lacm-planta?createDatabaseIfNotExist=true # OLD MULTI-CONTAINER URL
    #url: jdbc:postgresql://dpg-cpuutq1u0jms73ahqplg-a.oregon-postgres.render.com:5432/lacmdb # RENDER EXTERNAL
    #url: jdbc:postgresql://dpg-cpuutq1u0jms73ahqplg-a:5432/lacmdb # RENDER INTERNAL
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true # LOCAL DEV
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    #driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'America/Bogota'

  jpa:
    #database-platform: org.hibernate.dialect.MySQL8Dialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: validate  # Modo seguro - solo valida, no modifica
    properties:
      hibernate:
        globally_quoted_identifiers: true
        jdbc:
          time_zone: America/Bogota
        #dialect: org.hibernate.dialect.MySQL8Dialect
        #dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    time-zone: America/Bogota

  flyway:
    enabled: true  # Habilitado con baseline configurado
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 30000
server:
  port: 8080
  error:
    path: /error
    whitelabel:
      enabled: false

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

app:
  agent-assistant:
    api:
      enabled: ${ASSISTANT_ENABLED:false}
      key: ${OPENAI_API_KEY:}
      model: ${ASSISTANT_MODEL:gpt-5.4-mini-2026-03-17}
    quota-id: ${ASSISTANT_QUOTA_ID:exotic-initial}
    budget-usd: ${ASSISTANT_BUDGET_USD:0}
    input-usd-per-million: ${ASSISTANT_INPUT_USD_PER_MILLION:0.75}
    cached-input-usd-per-million: ${ASSISTANT_CACHED_INPUT_USD_PER_MILLION:0.075}
    output-usd-per-million: ${ASSISTANT_OUTPUT_USD_PER_MILLION:4.50}
  control-engine:
    legacy:
      write-mode: ${CONTROL_ENGINE_LEGACY_WRITE_MODE:BRIDGE}

#security:
#  user:
#   name: admin
#   password: admin

---
# Linea consolidada: activar explicitamente y usar solo con una base nueva.
spring:
  config:
    activate:
      on-profile: schema-v1
  flyway:
    enabled: true
    locations: classpath:db/migration-v1
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
    clean-disabled: true
    out-of-order: false
    placeholder-replacement: false
  jpa:
    hibernate:
      ddl-auto: validate
