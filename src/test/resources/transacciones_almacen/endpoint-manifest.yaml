module: TransaccionesAlmacen
frontendRoot: exotic-app-frontend/src/pages/TransaccionesAlmacen
tag: transacciones-almacen-local
flows:
  bootstrap:
    - GET /api/super-master-directives/config
  ingreso_ocm:
    - GET /ingresos_almacen/ocms_pendientes_ingreso
    - GET /ingresos_almacen/consultar_transin_de_ocm
    - GET /ingresos_almacen/transaccion/{transaccionId}/movimientos
    - GET /ingresos_almacen/ocm/{ordenCompraId}/consolidado-materiales
    - POST /movimientos/save_doc_ingreso_oc
    - PUT /compras/orden_compra/{ordenCompraId}/close
  dispensacion:
    - GET /salidas_almacen/dispensacion-v2/mps-semanal
    - POST /salidas_almacen/dispensacion-v2/preparacion
    - POST /salidas_almacen/dispensacion-v2/materiales-receta
    - POST /salidas_almacen/dispensacion-v2/asignacion-lotes
    - POST /salidas_almacen/dispensacion-v2/finalizar
    - GET /salidas_almacen/dispensacion-v2/materiales/{productoId}/lotes-disponibles
    - GET /salidas_almacen/dispensacion-v2/ordenes-fabricacion
    - GET /salidas_almacen/dispensacion-v2/ordenes-fabricacion/{ordenFabricacionId}/preparacion
    - POST /salidas_almacen/dispensacion-v2/ordenes-fabricacion/{ordenFabricacionId}/asignacion-lotes
    - POST /salidas_almacen/dispensacion-v2/ordenes-fabricacion/{ordenFabricacionId}/finalizar
  historial_dispensaciones:
    - POST /salidas_almacen/historial_dispensacion_filter
    - GET /ingresos_almacen/transaccion/{transaccionId}/movimientos
  ingreso_terminados:
    - GET /ingresos_terminados_almacen/pendientes/resumen
    - GET /ingresos_terminados_almacen/pendientes
    - POST /ingresos_terminados_almacen/reporte-hyl
    - POST /ingresos_terminados_almacen/cierres
  ajustes:
    - POST /productos/consulta1
    - GET /movimientos/ajustes/lotes-disponibles
    - GET /movimientos/ajustes/lotes-existentes
    - POST /movimientos/ajustes
  averias:
    - GET /productos/search_mprima
    - GET /api/averias/search_orden_by_lote
    - GET /api/averias/orden/{ordenProduccionId}/items-dispensados
    - GET /api/averias/orden/{ordenProduccionId}/historial
    - GET /api/averias/almacen/search-material-by-lote
    - POST /api/averias/almacen/registrar
    - POST /api/averias/registrar
    - POST /api/areas-produccion/search_by_name
