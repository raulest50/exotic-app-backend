name: Verify backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: '21'
          distribution: temurin
          problem-matcher: true
          cache: gradle
      - name: Compile and package
        run: bash ./gradlew build -x test --no-daemon
      - name: Deployment-relevant unit regressions (no remote services)
        run: >-
          bash ./gradlew test --no-daemon
          --tests '*CorsConfigTest'
          --tests '*JwtTokenProviderTest'
          --tests '*BackupV2ArchiveServiceTest'
          --tests '*BackupV2ImportServiceTest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-jar
          path: build/libs/exotic-app-v1.jar
          if-no-files-found: error
          archive: true
      - name: Report staging connection
        if: github.event_name == 'push'
        env:
          DISPATCH_CONFIGURED: ${{ vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID != '' }}
        run: |
          if [ "$DISPATCH_CONFIGURED" = true ]; then
            echo 'Backend verified; requesting the independent staging pipeline.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Backend verified. Staging dispatch is pending GitHub App configuration; no deployment was requested.' >> "$GITHUB_STEP_SUMMARY"
          fi
  request-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: broker
        with:
          client-id: ${{ vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYMENT_DISPATCH_PRIVATE_KEY }}
          owner: raulest50
          repositories: exotic-app-deployment
          permission-actions: write
      - name: Request backend staging build; no direct VM access
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          gh api --method POST repos/raulest50/exotic-app-deployment/actions/workflows/staging.yml/dispatches
          -f ref=main -f 'inputs[component]=backend' -f "inputs[source_sha]=$SOURCE_SHA"
          -f "inputs[source_run_id]=$SOURCE_RUN_ID" -f "inputs[source_run_attempt]=$SOURCE_RUN_ATTEMPT"
