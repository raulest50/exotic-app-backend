name: Verify backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: '21'
          distribution: temurin
          problem-matcher: true
          cache: gradle
      - name: Compile and package
        run: bash ./gradlew build -x test --no-daemon
      - name: Deployment-relevant unit regressions (no remote services)
        run: >-
          bash ./gradlew test --no-daemon
          --tests '*CorsConfigTest'
          --tests '*JwtTokenProviderTest'
          --tests '*BackupV2ArchiveServiceTest'
          --tests '*BackupV2ImportServiceTest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-jar
          path: build/libs/exotic-app-v1.jar
          if-no-files-found: error
          archive: true
  request-release:
    needs: verify
    if: github.event_name == 'push' && vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: broker
        with:
          client-id: ${{ vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYMENT_DISPATCH_PRIVATE_KEY }}
          owner: raulest50
          repositories: exotic-app-deployment
          permission-actions: write
      - name: Request a paired release; no direct VM access
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          gh api --method POST repos/raulest50/exotic-app-deployment/actions/workflows/release.yml/dispatches
          -f ref=main -f "inputs[backend_sha]=$SOURCE_SHA" -f 'inputs[frontend_sha]=main'
