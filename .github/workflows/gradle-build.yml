name: Verify backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Compile and package
        run: bash ./gradlew build -x test --no-daemon
      - name: Deployment-relevant unit regressions (no remote services)
        run: >-
          bash ./gradlew test --no-daemon
          --tests '*CorsConfigTest'
          --tests '*JwtTokenProviderTest'
          --tests '*BackupV2ArchiveServiceTest'
          --tests '*BackupV2ImportServiceTest'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-jar
          path: build/libs/exotic-app-v1.jar
          if-no-files-found: error
  request-release:
    needs: verify
    if: github.event_name == 'push' && vars.DEPLOYMENT_DISPATCH_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: broker
        with:
          app-id: ${{ vars.DEPLOYMENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_DISPATCH_PRIVATE_KEY }}
          owner: raulest50
          repositories: exotic-app-deployment
          permission-actions: write
      - name: Request a paired release; no direct VM access
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          gh api --method POST repos/raulest50/exotic-app-deployment/actions/workflows/release.yml/dispatches
          -f ref=main -f "inputs[backend_sha]=$SOURCE_SHA" -f 'inputs[frontend_sha]=main'
